<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title data-i18n="Studio example">Studio example</title><style>
:root{font:15px/1.5 "FK Grotesk Neue","PingFang SC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:-.15px;-webkit-font-smoothing:antialiased;color:#222222;background:#f7f7f7}html{scrollbar-width:none}::-webkit-scrollbar{display:none}*{box-sizing:border-box}body{margin:0;padding:20px}header{display:flex;align-items:center;justify-content:space-between;font-size:12px;margin:4px 0 40px;color:#777777}.mark{width:27px;height:27px;border:1px solid #777777;display:grid;place-items:center;border-radius:7px;color:#444444}small{font-size:10px;letter-spacing:1.5px;color:#777777}h1{font-size:24px;line-height:1.4;font-weight:400;letter-spacing:-.72px;margin:10px 0 12px}p{color:#777777;font-size:12px;line-height:1.7;margin:0 0 26px}section{background:#fff;border:1px solid #e1e1e1;padding:17px;border-radius:9px;margin-bottom:14px}label{display:block;font-size:12px;margin-bottom:8px}textarea{font-family:inherit;font-size:14px;line-height:1.6;width:100%;min-height:110px;resize:vertical;border:1px solid #dddddd;border-radius:5px;padding:12px;background:#fafafa;color:inherit}button{font:inherit;border:1px solid #dddddd;border-radius:6px;background:#fff;padding:10px 15px;cursor:pointer;width:100%;font-size:12px}.primary{background:#242424;color:#fff;border-color:#242424;margin-top:12px}.row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;margin:0;align-items:center}input{accent-color:#242424}.status{display:flex;gap:8px;color:#777777;font-size:11px;margin-top:17px}.status i{background:#888888;height:6px;width:6px;border-radius:50%;margin-top:5px}footer{font-size:10px;color:#999999;margin-top:32px;border-top:1px solid #e1e1e1;padding-top:14px}
</style></head><body><header><span class="mark">◧</span><span data-i18n="YOUR NEXT PROJECT">YOUR NEXT PROJECT</span></header><small data-i18n="NEUTRAL EXAMPLE">NEUTRAL EXAMPLE</small><h1 data-i18n="A little space&#10;to think." style="white-space:pre-line">A little space<br>to think.</h1><p data-i18n="Edit a message here. The same container updates on the glasses canvas beside it.">Edit a message here. The same container updates on the glasses canvas beside it.</p><section><label for="message" data-i18n="Display text">Display text</label><textarea id="message">Look up.\nThere is room for a fresh perspective.</textarea><button id="send" class="primary" data-i18n="Update glasses ↗">Update glasses ↗</button></section><section><label class="row"><span data-i18n="Show status mark">Show status mark</span> <input type="checkbox" id="icon" checked></label><label class="row"><span data-i18n="Show text">Show text</span> <input type="checkbox" id="text" checked></label></section><button id="reset" data-i18n="Reset example">Reset example</button><div class="status"><i></i><span id="status">Preview bridge ready</span></div><footer data-i18n="No account, AI service or stored personal data.">No account, AI service or stored personal data.</footer><script type="module" src="/example/app.js"></script></body></html>
